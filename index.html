        <h1 class="serif">El evento que tu equipo <em>no va a olvidar</em>.</h1>
        <p>${esc(MARCA.eslogan)}</p>
        <button class="btn btn-oro" id="empezar">${esc(MARCA.botonEmpezar)} →</button>
        <div class="stats">
          <div><strong>${CATALOGO.length}</strong>experiencias</div>
          <div><strong>4</strong>preguntas</div>
          <div><strong>1 min</strong>para tu propuesta</div>
        </div>
      </section>
      <h2 class="sec">${esc(MARCA.tituloCatalogo)}</h2>
      <p class="sub">Explora las opciones o deja que te recomendemos la ideal.</p>
      <div class="filtros">${cats.map((c) => `<button class="filtro ${c === filtro ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="grid">${lista.map(tarjeta).join("")}</div>
      <div class="cta-bloque">
        <div><h3>¿No sabes cuál elegir?</h3><p>Responde 4 preguntas y te decimos cuál va contigo.</p></div>
        <button class="btn btn-oro" id="empezar2">Encontrar mi experiencia →</button>
      </div></div>`;
    const go = () => { paso = 0; render(); };
    document.getElementById("empezar").onclick = go;
    document.getElementById("empezar2").onclick = go;
    app.querySelectorAll(".filtro").forEach((b) => (b.onclick = () => { filtro = b.dataset.c; inicio(); }));
  }

  function pregunta() {
    const q = PREGUNTAS[paso];
    const total = PREGUNTAS.length;
    const elegida = respuestas[q.id];
    app.innerHTML = `<section class="quiz fade">
      <div class="progreso"><span>Pregunta ${paso + 1} de ${total}</span><span>${Math.round((paso / total) * 100)}%</span></div>
      <div class="barra"><div style="width:${((paso + 1) / total) * 100}%"></div></div>
      <h2>${esc(q.titulo)}</h2>
      <p class="ayuda">${esc(q.ayuda)}</p>
      <div class="opciones" role="radiogroup">${q.opciones.map((o) => `
        <button class="op ${elegida === o.valor ? "sel" : ""}" role="radio" aria-checked="${elegida === o.valor}" data-v="${esc(o.valor)}">
          <span class="punto"></span><span><strong>${esc(o.etiqueta)}</strong><small>${esc(o.detalle)}</small></span>
        </button>`).join("")}</div>
      <div class="nav">
        <button class="btn btn-linea" id="atras">← Atrás</button>
        <button class="btn btn-oro" id="sig">${paso === total - 1 ? "Ver mi experiencia" : "Siguiente"} →</button>
      </div>
      <div class="aviso" id="aviso"></div>
    </section>`;
    app.querySelectorAll(".op").forEach((b) => (b.onclick = () => {
      respuestas[q.id] = b.dataset.v;
      app.querySelectorAll(".op").forEach((x) => { const on = x === b; x.classList.toggle("sel", on); x.setAttribute("aria-checked", on); });
      document.getElementById("aviso").textContent = "";
    }));
    document.getElementById("atras").onclick = () => { paso -= 1; render(); };
    document.getElementById("sig").onclick = () => {
      if (!respuestas[q.id]) { document.getElementById("aviso").textContent = "Elige una opción para continuar."; return; }
      paso += 1; render();
    };
  }

  function calcular() {
    const max = PREGUNTAS.reduce((s, q) => s + (PESOS[q.id] || 1), 0);
    return CATALOGO.map((e, i) => {
      let pts = 0; const coinc = [];
      PREGUNTAS.forEach((q) => {
        const v = respuestas[q.id];
        if (e.idealPara[q.id] && e.idealPara[q.id].includes(v)) {
          pts += PESOS[q.id] || 1;
          const o = q.opciones.find((o) => o.valor === v);
          const et = o.etiqueta.charAt(0).toLowerCase() + o.etiqueta.slice(1);
          coinc.push((q.razon || "Ideal para {opcion}").replace("{opcion}", et));
        }
      });
      // afinidad mínima 62% para que el resultado nunca se sienta pobre
      const afin = Math.round(62 + (pts / max) * 37);
      return { e, i, pts, coinc, afin };
    }).sort((a, b) => b.pts - a.pts || a.i - b.i);
  }

  function linkFinal(nombre) {
    if (!AGREGAR_RESUMEN_AL_WHATSAPP || !/wa\.me|whatsapp\.com/.test(MI_LINK)) return MI_LINK;
    const perfil = PREGUNTAS.map((q) => q.opciones.find((o) => o.valor === respuestas[q.id])?.etiqueta).filter(Boolean).join(" · ");
    const txt = `Hola, me interesa cotizar la experiencia "${nombre}" con ${MARCA.nombre}. Mi evento: ${perfil}.`;
    return MI_LINK + (MI_LINK.includes("?") ? "&" : "?") + "text=" + encodeURIComponent(txt);
  }

  function resultado() {
    const ranking = calcular();
    const top = ranking[0];
    const e = top.e;
    const perfil = PREGUNTAS.map((q) => q.opciones.find((o) => o.valor === respuestas[q.id])).filter(Boolean);
    const razones = top.coinc.length
      ? top.coinc.map((t) => `<li>${esc(t)}</li>`).join("")
      : `<li>Es la experiencia más versátil de nuestro catálogo y la adaptamos a lo que necesitas.</li>`;
    app.innerHTML = `<section class="res fade">
      <div class="kicker">${esc(MARCA.tituloResultado)}</div>
      <article class="ganadora">
        <div class="vis" style="background:${grad(e.categoria)}">
          <span class="chip" style="background:rgba(14,23,38,.55);color:var(--crema)">${esc(e.categoria)}</span>
          <span class="afinidad">${top.afin}% de afinidad</span>
        </div>
        <div class="body">
          <h2>${esc(e.nombre)}</h2>
          <p class="desc">${esc(e.descripcion)}</p>
          <div class="porque"><b>Por qué es para ti</b><ul>${razones}</ul></div>
          <div class="etq">Qué incluye</div>
          <ul class="incluye">${e.incluye.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          <div class="etq">Tu evento</div>
          <div class="perfil">${perfil.map((o) => `<span>${esc(o.etiqueta)}</span>`).join("")}</div>
          <div class="inv">Inversión <b>${puntos(e.inversion)}</b></div>
          <div class="final">
            <a class="btn btn-oro btn-grande" href="${esc(linkFinal(e.nombre))}" target="_blank" rel="noopener">${esc(MARCA.botonFinal)} →</a>
            <p>${esc(MARCA.notaFinal)}</p>
          </div>
        </div>
      </article>
      <div class="alts">
        <h2 class="sec">También podrían encantarte</h2>
        <p class="sub">Otras opciones que encajan con tu evento.</p>
        <div class="grid">${ranking.slice(1, 3).map((r) => tarjeta(r.e)).join("")}</div>
      </div>
      <div class="acciones"><button class="btn btn-linea" id="otra">↺ Volver a empezar</button></div>
    </section>`;
    document.getElementById("otra").onclick = () => { respuestas = {}; paso = -1; filtro = "Todas"; render(); };
  }

  render();
})();
</script>
</body>
</html>
